<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;
function Ico({ size = 16, children, style, className }) {
  return <span className={className} style={{ fontSize: size, lineHeight: 1, display: "inline-block", ...style }}>{children}</span>;
}
const Search = (p) => <Ico {...p}>🔍</Ico>;
const Heart = ({ fill, ...p }) => <Ico {...p}>{fill && fill !== "none" ? "❤️" : "🤍"}</Ico>;
const ShoppingCart = (p) => <Ico {...p}>🛒</Ico>;
const Bell = (p) => <Ico {...p}>🔔</Ico>;
const User = (p) => <Ico {...p}>👤</Ico>;
const Sun = (p) => <Ico {...p}>☀️</Ico>;
const Moon = (p) => <Ico {...p}>🌙</Ico>;
const Monitor = (p) => <Ico {...p}>💻</Ico>;
const Star = ({ fill, ...p }) => <Ico {...p}>{fill && fill !== "none" ? "★" : "☆"}</Ico>;
const ChevronLeft = (p) => <Ico {...p}>‹</Ico>;
const ChevronRight = (p) => <Ico {...p}>›</Ico>;
const BookOpen = (p) => <Ico {...p}>📖</Ico>;
const Clock = (p) => <Ico {...p}>⏰</Ico>;
const Check = (p) => <Ico {...p}>✔</Ico>;
const X = (p) => <Ico {...p}>✕</Ico>;
const Menu = (p) => <Ico {...p}>☰</Ico>;
const ArrowRight = (p) => <Ico {...p}>→</Ico>;
const Bookmark = ({ fill, ...p }) => <Ico {...p}>{fill && fill !== "none" ? "🔖" : "📑"}</Ico>;
const Minus = (p) => <Ico {...p}>−</Ico>;
const Plus = (p) => <Ico {...p}>+</Ico>;
const Trash2 = (p) => <Ico {...p}>🗑</Ico>;
const Loader2 = (p) => <Ico {...p}>⏳</Ico>;
const LogOut = (p) => <Ico {...p}>🚪</Ico>;
const API_BASE = "https://nexora-backend-production-a8dd.up.railway.app";

async function api(path, { method = "GET", body, token } = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) throw new Error(data?.error || "Something went wrong. Please try again.");
  return data;
}

function loadRazorpayScript() {
  return new Promise((resolve) => {
    if (window.Razorpay) return resolve(true);
    const script = document.createElement("script");
    script.src = "https://checkout.razorpay.com/v1/checkout.js";
    script.onload = () => resolve(true);
    script.onerror = () => resolve(false);
    document.body.appendChild(script);
  });
}

const AUDIENCES = [
  { id: "kids", label: "Kids", tag: "Ages 3–17", blurb: "Stories, science and skills for growing minds." },
  { id: "men", label: "Men", tag: "Career & Growth", blurb: "Business, leadership and personal development." },
  { id: "women", label: "Women", tag: "Career & Growth", blurb: "Leadership, craft and financial confidence." },
  { id: "parents", label: "Parents", tag: "Family Learning", blurb: "Raising curious, capable kids in a changing world." },
  { id: "careers", label: "Careers", tag: "Future of Work", blurb: "Skills, tools and plans for the next role." },
];

const PALETTE = ["#1C2B4A", "#3E7C7B", "#AD7C3D", "#6E5A45", "#2F5233", "#5A3E5A", "#334155", "#7C5C3E"];
function colorFor(id) {
  let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

const READER_PAGES = [
  "Every plan starts the same way: with a question worth answering. This chapter is about learning to ask a better one.",
  "Most people don't fail from lack of effort. They fail from aiming effort at the wrong target for too long.",
  "The framework in this book has three parts. You'll use all three, in order, every time you sit down to plan.",
  "Part one is orientation — figuring out where you actually stand, not where you assume you stand.",
  "Part two is the method itself. It's short on purpose. A plan you can hold in your head is a plan you'll follow.",
  "Part three is the review — the part almost everyone skips, and the part that makes the whole thing work over time.",
];

/* ---------------------------------- THEME ---------------------------------- */

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

.plt-root { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.plt-root h1, .plt-root h2, .plt-root h3, .plt-root .serif { font-family: 'Fraunces', serif; }
.plt-root * { box-sizing: border-box; }
.plt-root button { font-family: inherit; cursor: pointer; }
.plt-root :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

  --bg:#F6F2EA; --surface:#FFFFFF; --surface-2:#EFE7D5; --text:#20242B; --text-secondary:#61636b;
  --border:#DBD1B9; --btn-bg:#1C2B4A; --btn-text:#FBF8F1; --accent:#AD7C3D; --teal:#3E7C7B;
  --success:#2F7A4F; --error:#AE4436; --warning:#AD7C3D;
}
[data-theme="night"] {
  --bg:#0E141F; --surface:#161E2B; --surface-2:#1E2836; --text:#E9E4D6; --text-secondary:#9AA1AE;
  --border:#2B3444; --btn-bg:#8FA6D6; --btn-text:#0E141F; --accent:#C79A56; --teal:#5FA6A3;
  --success:#5FAE7C; --error:#D97B6C; --warning:#C79A56;
}
.reader-day { background:#FBF8F1; color:#262322; }
.reader-night { background:#14181F; color:#E4E1D6; }
.reader-sepia { background:#F1E6CF; color:#4A3A25; }

.card { background: var(--surface); border: 1px solid var(--border); }
.surface2 { background: var(--surface-2); }
.text-sec { color: var(--text-secondary); }
.border-c { border-color: var(--border); }
.btn-primary { background: var(--btn-bg); color: var(--btn-text); }
.btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
.accent-text { color: var(--accent); }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 3px; font-weight: 600; }
.badge-new { background: var(--teal); color: var(--btn-text); }
.badge-free { background: var(--success); color: white; }
.badge-rent { background: var(--accent); color: white; }
.badge-sale { background: var(--error); color: white; }
.badge-err { background: var(--error); color: white; }
.line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.scrollbar-none::-webkit-scrollbar{display:none;}

`;

function useSystemDark() {
  const [dark, setDark] = useState(false);
  useEffect(() => {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    setDark(mq.matches);
    const fn = (e) => setDark(e.matches);
    mq.addEventListener?.("change", fn);
    return () => mq.removeEventListener?.("change", fn);
  }, []);
  return dark;
}

/* ---------------------------------- SMALL UI ---------------------------------- */

function AccessBadge({ book }) {
  if (book.access === "FREE") return <span className="badge badge-free">FREE</span>;
  if (book.access === "RENT") return <span className="badge badge-rent">RENT</span>;
  return null;
}

function BookCard({ book, onOpen, onWishlist, wished, onQuickAdd }) {
  const cover = book.coverUrl || colorFor(book.id);
  return (
    <div className="card rounded-md overflow-hidden flex flex-col">
      <button onClick={() => onOpen(book)} className="text-left">
        <div className="h-40 flex items-center justify-center relative" style={{ background: cover }}>
          <span className="serif text-white/90 text-2xl px-4 text-center leading-tight">{book.title.split(" ").slice(0, 3).join(" ")}</span>
          <div className="absolute top-2 left-2 flex gap-1 flex-wrap">
            {(book.badges || []).slice(0, 2).map((b) => (
              <span key={b} className={`badge ${b === "FREE" ? "badge-free" : b === "LIMITED TIME" ? "badge-sale" : "badge-new"}`}>{b}</span>
            ))}
          </div>
        </div>
      </button>
      <div className="p-3 flex flex-col gap-1.5 flex-1">
        <button onClick={() => onOpen(book)} className="text-left">
          <h3 className="text-sm font-semibold leading-snug line-clamp-2">{book.title}</h3>
        </button>
        <p className="text-xs text-sec">{book.author}</p>
        <div className="flex items-center justify-between mt-auto pt-1">
          <div className="flex items-baseline gap-1.5">
            {book.access === "FREE" ? (
              <span className="text-sm font-semibold" style={{ color: "var(--success)" }}>Free</span>
            ) : (
              <>
                <span className="text-sm font-semibold">₹{book.price}</span>
                {book.originalPrice && <span className="text-xs text-sec line-through">₹{book.originalPrice}</span>}
                {book.access === "RENT" && <span className="text-[11px] text-sec">/{book.rentDurationDays}d</span>}
              </>
            )}
          </div>
          <div className="flex items-center gap-1">
            <button aria-label="Wishlist" onClick={() => onWishlist(book)} className="p-1.5 rounded">
              <Heart size={16} fill={wished ? "var(--error)" : "none"} color={wished ? "var(--error)" : "var(--text-secondary)"} />
            </button>
            <button aria-label="Add to cart" onClick={() => onQuickAdd(book)} className="p-1.5 rounded btn-outline">
              <ShoppingCart size={15} />
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function SectionHeading({ title, action }) {
  return (
    <div className="flex items-end justify-between mb-4">
      <h2 className="serif text-xl md:text-2xl font-semibold">{title}</h2>
      {action}
    </div>

}

function EmptyState({ title, body }) {
  return (
    <div className="card rounded-md py-14 flex flex-col items-center text-center px-6">
      <div className="w-12 h-12 rounded-full surface2 flex items-center justify-center mb-3"><BookOpen size={20} className="text-sec" /></div>
      <h3 className="font-semibold">{title}</h3>
      <p className="text-sm text-sec mt-1 max-w-xs">{body}</p>

}

function Spinner({ label }) {
  return (
    <div className="flex flex-col items-center justify-center py-16 gap-3 text-sec">
      <Loader2 size={22} className="spin" />
      <span className="text-sm">{label || "Loading..."}</span>
    </div>

}

/* ---------------------------------- APP ---------------------------------- */

function App() {
  const systemDark = useSystemDark();
  const [themeMode, setThemeMode] = useState("system");
  const resolvedTheme = themeMode === "system" ? (systemDark ? "night" : "day") : themeMode;

  const [view, setView] = useState({ name: "home" });
  const [query, setQuery] = useState("");
  const [toast, setToast] = useState(null);
  const [themeMenuOpen, setThemeMenuOpen] = useState(false);
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

  // Auth (in-memory only — refreshing the page logs you out, since this is a demo without device storage)
  const [token, setToken] = useState(null);
  const [user, setUser] = useState(null);
  const [authMode, setAuthMode] = useState(null); // null | 'login' | 'signup'
  const [authBusy, setAuthBusy] = useState(false);
  const [authError, setAuthError] = useState(null);

  // Data
  const [books, setBooks] = useState([]);
  const [booksLoading, setBooksLoading] = useState(true);
  const [booksError, setBooksError] = useState(null);
  const [library, setLibrary] = useState([]);
  const [wishlist, setWishlist] = useState([]); // array of bookIds
  const [cart, setCart] = useState([]); // {bookId, access}
  const [checkoutBusy, setCheckoutBusy] = useState(false);

  const bookById = (id) => books.find((b) => b.id === id);

  function flash(msg) {
    setToast(msg);
    window.clearTimeout(flash._t);
    flash._t = window.setTimeout(() => setToast(null), 2500);
  }

  const fetchBooks = useCallback(async (params = {}) => {
    setBooksLoading(true);
    setBooksError(null);
    try {
      const qs = new URLSearchParams(params).toString();
      const data = await api(`/api/books${qs ? `?${qs}` : ""}`);
      setBooks(data);
    } catch (e) {
      setBooksError(e.message);
    } finally {
      setBooksLoading(false);
    }
  }, []);

  useEffect(() => { fetchBooks(); }, [fetchBooks]);

  const fetchLibrary = useCallback(async (tok) => {
    if (!tok) return;
    try {
      const data = await api("/api/library", { token: tok });
      setLibrary(data);
    } catch (e) { /* ignore silently */ }
  }, []);

  const fetchWishlist = useCallback(async (tok) => {
    if (!tok) return;
    try {
      const data = await api("/api/wishlist", { token: tok });
      setWishlist(data.map((w) => w.bookId));
    } catch (e) { /* ignore */ }
  }, []);

  function requireAuthOrPrompt() {
    if (!token) { setAuthMode("login"); return false; }
    return true;
  }

  async function handleAuthSubmit(mode, form) {
    setAuthBusy(true);
    setAuthError(null);
    try {
      const path = mode === "login" ? "/api/auth/login" : "/api/auth/signup";
      const data = await api(path, { method: "POST", body: form });
      setToken(data.token);
      setUser(data.user);
      setAuthMode(null);
      flash(mode === "login" ? "Welcome back" : "Account created");
      fetchLibrary(data.token);
      fetchWishlist(data.token);
    } catch (e) {
      setAuthError(e.message);
    } finally {
      setAuthBusy(false);
    }
  }

  function logout() {
    setToken(null); setUser(null); setLibrary([]); setWishlist([]); setCart([]);
    flash("Logged out");
    setView({ name: "home" });
  }

  async function toggleWishlist(book) {
    if (!requireAuthOrPrompt()) return;
    try {
      const res = await api(`/api/wishlist/${book.id}`, { method: "POST", token });
      setWishlist((w) => (res.wishlisted ? [...w, book.id] : w.filter((id) => id !== book.id)));
      flash(res.wishlisted ? "Saved to wishlist" : "Removed from wishlist");
    } catch (e) { flash(e.message); }
  }

  function addToCart(book, access) {
    if (!requireAuthOrPrompt()) return;
    if (library.some((l) => l.bookId === book.id)) { flash("Already in your library"); return; }
    if (cart.some((c) => c.bookId === book.id)) { flash("Already in your cart"); return; }
    const acc = access || book.access;
    setCart((c) => [...c, { bookId: book.id, access: acc }]);
    flash("Added to cart");
  }

  function removeFromCart(bookId) {
    setCart((c) => c.filter((i) => i.bookId !== bookId));
  }

  async function getFree(book) {
    if (!requireAuthOrPrompt()) return;
    const already = library.find((l) => l.bookId === book.id);
    if (already) { setView({ name: "reader", id: book.id }); return; }
    try {
      await api(`/api/orders/free/${book.id}`, { method: "POST", token });
      flash("Added to your free library");
      fetchLibrary(token);
    } catch (e) { flash(e.message); }
  }

  async function checkout() {
    if (!requireAuthOrPrompt()) return;
    if (cart.length === 0) return;
    setCheckoutBusy(true);
    try {
      const items = cart.map((c) => ({ bookId: c.bookId, access: c.access }));
      const order = await api("/api/orders/checkout", { method: "POST", token, body: { items } });

      const ok = await loadRazorpayScript();
      if (!ok) { flash("Could not load payment window. Check your connection."); setCheckoutBusy(false); return; }

      const rzp = new window.Razorpay({
        key: order.razorpayKeyId,
        amount: order.amount * 100,
        currency: "INR",
        name: "Nexora",
        description: "Book purchase",
        order_id: order.razorpayOrderId,
        theme: { color: "#1C2B4A" },
        handler: async function (response) {
          try {
            await api("/api/orders/verify", {
              method: "POST",
              token,
              body: {
                razorpay_order_id: response.razorpay_order_id,
                razorpay_payment_id: response.razorpay_payment_id,
                razorpay_signature: response.razorpay_signature,
              },
            });
            flash("Payment successful — added to your library");
            setCart([]);
            fetchLibrary(token);
            setView({ name: "library" });
          } catch (e) {
            flash("Payment verification failed: " + e.message);
          }
        },
        modal: {
          ondismiss: function () { flash("Payment cancelled"); },
        },
      });
      rzp.open();
    } catch (e) {
      flash(e.message);
    } finally {
      setCheckoutBusy(false);
    }
  }

  const searched = useMemo(() => {
    if (!query.trim()) return null;
    const q = query.toLowerCase();
    return books.filter((b) => b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q));
  }, [query, books]);

  const cartTotal = cart.reduce((sum, item) => {
    const b = bookById(item.bookId);
    return sum + (b ? (b.access === "FREE" ? 0 : b.price) : 0);
  }, 0);

  return (
    <div data-theme={resolvedTheme} className="plt-root">
      <style>{CSS}</style>

      <Header
        query={query} setQuery={setQuery}
        cartCount={cart.length} wishlistCount={wishlist.length}
        onNav={setView}
        themeMode={themeMode} setThemeMode={setThemeMode}
        themeMenuOpen={themeMenuOpen} setThemeMenuOpen={setThemeMenuOpen}
        mobileMenuOpen={mobileMenuOpen} setMobileMenuOpen={setMobileMenuOpen}
        user={user} onAuthOpen={setAuthMode} onLogout={logout}
      />

      <main className="max-w-6xl mx-auto px-4 md:px-6 pb-24">
        {booksError ? (
          <div className="pt-10"><EmptyState title="Couldn't load books" body={booksError} /></div>
        ) : booksLoading ? (
          <Spinner label="Loading the library..." />
        ) : searched ? (
          <SearchResults results={searched} onOpen={(b) => setView({ name: "detail", id: b.id })}
            onWishlist={toggleWishlist} wishlist={wishlist} onQuickAdd={(b) => addToCart(b)} query={query} clear={() => setQuery("")} />
        ) : view.name === "home" ? (
          <Home books={books} onNav={setView} onOpen={(b) => setView({ name: "detail", id: b.id })}
            onWishlist={toggleWishlist} wishlist={wishlist} onQuickAdd={(b) => addToCart(b)} />
        ) : view.name === "browse" ? (
          <Browse audienceId={view.audience} books={books} onOpen={(b) => setView({ name: "detail", id: b.id })}
            onWishlist={toggleWishlist} wishlist={wishlist} onQuickAdd={(b) => addToCart(b)} onBack={() => setView({ name: "home" })} />
        ) : view.name === "detail" ? (
          <Detail bookId={view.id} onWishlist={toggleWishlist} wishlist={wishlist}
            onAddToCart={addToCart} onGetFree={getFree} onOpenReader={(id) => setView({ name: "reader", id })}
            inLibrary={library.some((l) => l.bookId === view.id)} onBack={() => setView({ name: "home" })}
            allBooks={books} onOpenOther={(b) => setView({ name: "detail", id: b.id })} />
        ) : view.name === "cart" ? (
          <CartView cart={cart} bookById={bookById} onRemove={removeFromCart} onCheckout={checkout} total={cartTotal}
            busy={checkoutBusy} onBack={() => setView({ name: "home" })} />
        ) : view.name === "wishlist" ? (
          <WishlistView ids={wishlist} bookById={bookById} onRemove={toggleWishlist}
            onMove={(b) => { addToCart(b); toggleWishlist(b); }} onOpen={(b) => setView({ name: "detail", id: b.id })} />
        ) : view.name === "library" ? (
          <LibraryView library={library} bookById={bookById} onOpen={(id) => setView({ name: "reader", id })} loggedIn={!!token} onAuthOpen={setAuthMode} />
        ) : view.name === "reader" ? (
          <ReaderView bookId={view.id} bookById={bookById} token={token}
            onClose={() => setView({ name: "library" })} />
        ) : null}
      </main>

      <Footer onNav={setView} />

      {authMode && (
        <AuthModal mode={authMode} setMode={setAuthMode} busy={authBusy} error={authError}
          onSubmit={handleAuthSubmit} onClose={() => { setAuthMode(null); setAuthError(null); }} />
      )}

      {toast && (
        <div className="fixed bottom-5 left-1/2 -translate-x-1/2 card rounded-full px-4 py-2 text-sm shadow-lg flex items-center gap-2 z-50 max-w-[90%] text-center">
          {toast}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------- AUTH MODAL ---------------------------------- */

function AuthModal({ mode, setMode, busy, error, onSubmit, onClose }) {
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(0,0,0,.5)" }}>
      <div className="card rounded-md p-6 w-full max-w-sm relative">
        <button onClick={onClose} className="absolute top-3 right-3 p-1"><X size={18} /></button>
        <h2 className="serif text-xl font-semibold mb-1">{mode === "login" ? "Log in" : "Create your account"}</h2>
        <p className="text-sm text-sec mb-4">{mode === "login" ? "Welcome back to Nexora." : "Join to purchase, rent and save books."}</p>

        <form onSubmit={(e) => { e.preventDefault(); onSubmit(mode, mode === "login" ? { email, password } : { name, email, password }); }} className="flex flex-col gap-3">
          {mode === "signup" && (
            <input required value={name} onChange={(e) => setName(e.target.value)} placeholder="Full name"
              className="input-field rounded px-3 py-2.5 text-sm" />
          )}
          <input required type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Email"
            className="input-field rounded px-3 py-2.5 text-sm" />
          <input required type="password" minLength={8} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Password (min 8 characters)"
            className="input-field rounded px-3 py-2.5 text-sm" />
          {error && <p className="text-xs badge-err rounded px-2 py-1.5">{error}</p>}
          <button disabled={busy} type="submit" className="btn-primary rounded-full py-2.5 text-sm font-medium flex items-center justify-center gap-2 disabled:opacity-60">
            {busy && <Loader2 size={14} className="spin" />} {mode === "login" ? "Log in" : "Create account"}
          </button>
        </form>

        <button onClick={() => setMode(mode === "login" ? "signup" : "login")} className="text-xs text-sec mt-4 w-full text-center underline">
          {mode === "login" ? "New here? Create an account" : "Already have an account? Log in"}
        </button>
      </div>
    </div>
  );
}

function SearchResults({ results, onOpen, onWishlist, wishlist, onQuickAdd, query, clear }) {
  return (
    <div className="pt-8">
      <div className="flex items-center justify-between mb-4">

function Browse({ audienceId, books, onOpen, onWishlist, wishlist, onQuickAdd, onBack }) {
  const audience = AUDIENCES.find((a) => a.id === audienceId) || AUDIENCES[0];
  const [accessFilter, setAccessFilter] = useState("All");
  let list = books.filter((b) => b.audience === audience.id);

  return (
    <div className="pt-8">
      <button onClick={onBack} className="text-sm text-sec flex items-center gap-1 mb-4"><ChevronLeft size={14} /> Home</button>

        ))}

        <EmptyState title="Nothing here yet" body="No published books in this category yet." />
      ) : (
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">

      )}

  );
}

/* ---------------------------------- DETAIL ---------------------------------- */

function Detail({ bookId, onWishlist, wishlist, onAddToCart, onGetFree, onOpenReader, inLibrary, onBack, allBooks, onOpenOther }) {
  const [tab, setTab] = useState("about");
  const [book, setBook] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    let cancelled = false;
    setLoading(true); setError(null);
    api(`/api/books/${bookId}`).then((d) => { if (!cancelled) setBook(d); })
      .catch((e) => { if (!cancelled) setError(e.message); })
      .finally(() => { if (!cancelled) setLoading(false); });
    return () => { cancelled = true; };
  }, [bookId]);

  if (loading) return <div className="pt-8"><Spinner label="Loading book..." /></div>;
  if (error || !book) return <div className="pt-8"><EmptyState title="Couldn't load this book" body={error || "It may have been unpublished."} /></div>;

  const wished = wishlist.includes(book.id);
  const related = allBooks.filter((b) => b.audience === book.audience && b.id !== book.id).slice(0, 4);
  const cover = book.coverUrl || colorFor(book.id);

  return (
    <div className="pt-8">
      <button onClick={onBack} className="text-sm text-sec flex items-center gap-1 mb-5"><ChevronLeft size={14} /> Back</button>
      <div className="grid md:grid-cols-[280px_1fr] gap-8">
        <div>
          <div className="h-72 rounded-md flex items-center justify-center" style={{ background: cover }}>
            <span className="serif text-white text-2xl px-4 text-center">{book.title}</span>
          </div>
          <div className="flex flex-col gap-2 mt-4">
            {inLibrary ? (
              <button onClick={() => onOpenReader(book.id)} className="btn-primary rounded-full py-2.5 text-sm font-medium flex items-center justify-center gap-2">
                <BookOpen size={15} /> Continue Reading
              </button>
            ) : book.access === "FREE" ? (
              <button onClick={() => onGetFree(book)} className="btn-primary rounded-full py-2.5 text-sm font-medium">Add to Free Library</button>
            ) : (
              <>
                <button onClick={() => onAddToCart(book, "PURCHASE")} className="btn-primary rounded-full py-2.5 text-sm font-medium">Buy Now — ₹{book.price}</button>
                {book.access === "RENT" && (
                  <button onClick={() => onAddToCart(book, "RENT")} className="btn-outline rounded-full py-2.5 text-sm font-medium">Rent for {book.rentDurationDays} days — ₹{book.price}</button>
                )}
                <button onClick={() => onAddToCart(book)} className="btn-outline rounded-full py-2.5 text-sm font-medium flex items-center justify-center gap-2"><ShoppingCart size={14} /> Add to Cart</button>
              </>
            )}
            <button onClick={() => onWishlist(book)} className="rounded-full py-2.5 text-sm font-medium flex items-center justify-center gap-2 border border-c">
              <Heart size={14} fill={wished ? "var(--error)" : "none"} color={wished ? "var(--error)" : "currentColor"} /> {wished ? "Saved" : "Add to Wishlist"}
            </button>
          </div>
        </div>

        <div>
          <div className="flex gap-2 mb-2 flex-wrap">
            {(book.badges || []).map((b) => <span key={b} className="badge badge-new">{b}</span>)}
            <AccessBadge book={book} />
          </div>
          <h1 className="serif text-2xl font-semibold">{book.title}</h1>
          <p className="text-sec mt-1">{book.author} · {book.subcategory}{book.ageGroup ? ` · Ages ${book.ageGroup}` : ""}</p>

          <div className="flex gap-1 mt-6 border-b border-c overflow-x-auto scrollbar-none">
            {[["about", "About"], ["toc", "Contents"], ["reviews", "Reviews"]].map(([id, label]) => (
              <button key={id} onClick={() => setTab(id)} className={`px-3 py-2 text-sm whitespace-nowrap ${tab === id ? "border-b-2 font-medium" : "text-sec"}`} style={tab === id ? { borderColor: "var(--accent)" } : {}}>{label}</button>
            ))}
          </div>

          <div className="py-5 text-sm leading-relaxed">
            {tab === "about" && (
              <div className="flex flex-col gap-5">
                <div><h3 className="font-semibold mb-1.5">About this book</h3><p className="text-sec">{book.description}</p></div>
                {book.whatYouLearn?.length > 0 && (
                  <div><h3 className="font-semibold mb-1.5">What you will learn</h3>
                    <ul className="list-disc list-inside text-sec flex flex-col gap-1">{book.whatYouLearn.map((w) => <li key={w}>{w}</li>)}</ul>
                  </div>
                )}
                {book.whoFor && <div><h3 className="font-semibold mb-1.5">Who this book is for</h3><p className="text-sec">{book.whoFor}</p></div>}
                <div className="grid grid-cols-2 gap-2 text-xs text-sec surface2 rounded-md p-3">
                  <div>Language: {book.language}</div><div>Pages: {book.pages || "—"}</div>
                  <div>Format: {book.format}</div>
                </div>
              </div>
            )}
            {tab === "toc" && (book.toc?.length ? <ol className="list-decimal list-inside text-sec flex flex-col gap-1.5">{book.toc.map((c) => <li key={c}>{c}</li>)}</ol> : <p className="text-sec">Table of contents not available yet.</p>)}
            {tab === "reviews" && (
              (book.reviews?.length ? (
                <div className="flex flex-col gap-4">
                  {book.reviews.map((rv) => (
                    <div key={rv.id} className="border-b border-c pb-3">
                      <div className="flex items-center gap-2"><span className="font-medium">{rv.user?.name || "Reader"}</span></div>
                      <div className="flex gap-0.5 mt-0.5">{[1,2,3,4,5].map((n) => <Star key={n} size={13} fill={n <= rv.rating ? "var(--accent)" : "none"} color="var(--accent)" />)}</div>
                      <p className="text-sec mt-1">{rv.comment}</p>
                    </div>
                  ))}
                </div>
              ) : <p className="text-sec">No reviews yet — be the first to read and review this book.</p>)
            )}
          </div>
        </div>
      </div>

      {related.length > 0 && (
        <section className="mt-14">
          <SectionHeading title="More from this category" />
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            {related.map((b) => <BookCard key={b.id} book={b} onOpen={onOpenOther} onWishlist={onWishlist} wished={wishlist.includes(b.id)} onQuickAdd={() => onAddToCart(b)} />)}
          </div>
        </section>
      )}
    </div>
  );
}

/* ---------------------------------- CART / WISHLIST ---------------------------------- */

function CartView({ cart, bookById, onRemove, onCheckout, total, busy, onBack }) {
  return (
    <div className="pt-8 max-w-2xl">
      <button onClick={onBack} className="text-sm text-sec flex items-center gap-1 mb-5"><ChevronLeft size={14} /> Continue browsing</button>
      <h2 className="serif text-2xl font-semibold mb-6">Your Cart</h2>
      {cart.length === 0 ? (
        <EmptyState title="Your cart is empty" body="Browse the library and add a book or two." />
      ) : (
        <>
          <div className="flex flex-col gap-3 mb-6">

              const b = bookById(item.bookId);

                <div key={item.bookId} className="card rounded-md p-3 flex items-center gap-3">
                  <div className="w-14 h-16 rounded shrink-0" style={{ background: cover }} />
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-medium truncate">{b.title}</p>
                    <p className="text-xs text-sec">{item.access === "RENT" ? `Rent · ${b.rentDurationDays} days` : "Purchase"}</p>

                  <span className="text-sm font-medium">₹{b.price}</span>
                  <button onClick={() => onRemove(item.bookId)} className="p-1.5 text-sec"><Trash2 size={16} /></button>

          </div>
          <button onClick={onCheckout} disabled={busy} className="btn-primary rounded-full py-3 w-full text-sm font-medium mt-5 flex items-center justify-center gap-2 disabled:opacity-60">

function WishlistView({ ids, bookById, onRemove, onMove, onOpen }) {

    <div className="pt-8">
      <h2 className="serif text-2xl font-semibold mb-6">Wishlist</h2>

        <EmptyState title="Nothing saved yet" body="Tap the heart on any book to save it here." />
      ) : (
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">

        </div>
      )}

/* ---------------------------------- LIBRARY ---------------------------------- */

function LibraryView({ library, bookById, onOpen, loggedIn, onAuthOpen }) {
  const [tab, setTab] = useState("all");

  if (!loggedIn) {
    return (
      <div className="pt-8">
        <h2 className="serif text-2xl font-semibold mb-6">My Library</h2>
        <EmptyState title="Log in to see your library" body="Your purchases, rentals and free titles live here once you log in." />
        <div className="flex justify-center mt-4"><button onClick={() => onAuthOpen("login")} className="btn-primary rounded-full px-5 py-2 text-sm font-medium">Log in</button></div>
      </div>
    );
  }

  const items = library.map((l) => ({ ...l, book: bookById(l.bookId) })).filter((i) => i.book);
  const filtered =
    tab === "purchased" ? items.filter((i) => i.access === "PURCHASE") :
    tab === "free" ? items.filter((i) => i.access === "FREE") :
    tab === "rentals" ? items.filter((i) => i.access === "RENT" && !i.expired) :
    tab === "expired" ? items.filter((i) => i.access === "RENT" && i.expired) : items;

  return (
    <div className="pt-8">
      <h2 className="serif text-2xl font-semibold mb-5">My Library</h2>
      <div className="flex gap-2 mb-6 overflow-x-auto scrollbar-none">
        {[["all", "All"], ["purchased", "Purchased"], ["free", "Free"], ["rentals", "Active Rentals"], ["expired", "Expired"]].map(([id, label]) => (
          <button key={id} onClick={() => setTab(id)} className={`px-3 py-1.5 rounded-full text-xs whitespace-nowrap border border-c ${tab === id ? "btn-primary" : ""}`}>{label}</button>
        ))}
      </div>
      {filtered.length === 0 ? (
        <EmptyState title="No items here" body="Purchases, rentals and free titles you add will show up here." />
      ) : (
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          {filtered.map((it) => {
            const cover = it.book.coverUrl || colorFor(it.book.id);
            return (
              <div key={it.bookId} className="card rounded-md overflow-hidden">
                <button onClick={() => !it.expired && onOpen(it.bookId)} className="w-full h-32 flex items-center justify-center" style={{ background: cover, opacity: it.expired ? 0.5 : 1 }}>
                  <span className="serif text-white text-sm px-3 text-center">{it.book.title}</span>
                </button>
                <div className="p-3">
                  <p className="text-sm font-medium line-clamp-2">{it.book.title}</p>
                  <div className="flex items-center gap-1.5 text-xs text-sec mt-1">
                    {it.access === "RENT" ? <Clock size={12} /> : <BookOpen size={12} />}
                    {it.access === "RENT" ? (it.expired ? "Rental expired" : `Expires ${it.rentedUntil ? new Date(it.rentedUntil).toLocaleDateString() : ""}`) : it.access === "FREE" ? "Free" : "Purchased"}
                  </div>
                  <div className="h-1.5 surface2 rounded-full mt-2 overflow-hidden">
                    <div className="h-full btn-primary" style={{ width: `${it.progress || 0}%` }} />
                  </div>
                  {!it.expired && (
                    <button onClick={() => onOpen(it.bookId)} className="text-xs accent-text mt-2 flex items-center gap-1">
                      {it.progress > 0 ? "Continue reading" : "Start reading"} <ArrowRight size={12} />
                    </button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------- READER ---------------------------------- */

function ReaderView({ bookId, bookById, token, onClose }) {
  const [page, setPage] = useState(0);
  const [theme, setTheme] = useState("day");
  const [fontScale, setFontScale] = useState(1);
  const [bookmarked, setBookmarked] = useState(false);
  const [accessError, setAccessError] = useState(null);
  const [pages, setPages] = useState(null); // null while loading
  const book = bookById(bookId);

  useEffect(() => {
    let cancelled = false;
    setPages(null);
    api(`/api/library/${bookId}/content`, { token })
      .then((d) => { if (!cancelled) setPages(d.pages); })
      .catch((e) => { if (!cancelled) { setAccessError(e.message); setPages(READER_PAGES); } });
    return () => { cancelled = true; };
  }, [bookId, token]);

  const total = (pages || READER_PAGES).length;

  useEffect(() => {
    if (!pages) return;
    const progress = Math.round(((page + 1) / total) * 100);
    api(`/api/library/${bookId}/progress`, { method: "PATCH", token, body: { progress } }).catch(() => {});
  }, [page, pages]);

  if (accessError && accessError.includes("access")) {
    return (
      <div className="fixed inset-0 z-50 flex flex-col items-center justify-center gap-4 card">
        <p className="text-sm">{accessError}</p>
        <button onClick={onClose} className="btn-primary rounded-full px-5 py-2 text-sm">Close</button>
      </div>
    );
  }
  if (!book) return null;
  if (!pages) {
    return (
      <div className="fixed inset-0 z-50 flex items-center justify-center card">
        <Loader2 size={22} className="spin" />
      </div>
    );
  }
  const themeClass = theme === "day" ? "reader-day" : theme === "night" ? "reader-night" : "reader-sepia";

  return (
    <div className={`fixed inset-0 z-50 flex flex-col ${themeClass}`}>
      <div className="flex items-center justify-between px-4 md:px-6 py-3 border-b" style={{ borderColor: "rgba(128,128,128,.25)" }}>
        <button onClick={onClose} className="flex items-center gap-1.5 text-sm"><X size={16} /> Close</button>
        <span className="text-sm serif truncate max-w-[40%]">{book.title}</span>
        <div className="flex items-center gap-1">
          <button onClick={() => setBookmarked((b) => !b)} className="p-1.5"><Bookmark size={17} fill={bookmarked ? "currentColor" : "none"} /></button>
          <button onClick={() => setFontScale((s) => Math.max(0.8, s - 0.1))} className="p-1.5"><Minus size={15} /></button>
          <button onClick={() => setFontScale((s) => Math.min(1.6, s + 0.1))} className="p-1.5"><Plus size={15} /></button>
          {[["day", Sun], ["night", Moon], ["sepia", BookOpen]].map(([id, Icon]) => (
            <button key={id} onClick={() => setTheme(id)} className={`p-1.5 rounded ${theme === id ? "ring-1 ring-current" : ""}`}><Icon size={15} /></button>
          ))}
        </div>
      </div>
      <div className="flex-1 overflow-y-auto flex items-center justify-center px-6 py-8">
        {accessError && <p className="text-xs opacity-70 absolute top-16">Showing sample text — {accessError}</p>}
        <p className="serif max-w-lg leading-relaxed whitespace-pre-line" style={{ fontSize: `${1.05 * fontScale}rem` }}>{pages[page]}</p>
      </div>
      <div className="px-4 md:px-6 py-3 border-t flex items-center gap-4" style={{ borderColor: "rgba(128,128,128,.25)" }}>
        <button onClick={() => setPage((p) => Math.max(0, p - 1))} disabled={page === 0} className="p-1.5 disabled:opacity-30"><ChevronLeft size={18} /></button>
        <div className="flex-1 h-1 rounded-full bg-current/20 overflow-hidden"><div className="h-full bg-current" style={{ width: `${((page + 1) / total) * 100}%` }} /></div>
        <button onClick={() => setPage((p) => Math.min(total - 1, p + 1))} disabled={page === total - 1} className="p-1.5 disabled:opacity-30"><ChevronRight size={18} /></button>
        <span className="text-xs shrink-0">Page {page + 1} of {total}</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
